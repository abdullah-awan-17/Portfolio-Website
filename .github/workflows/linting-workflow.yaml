name: linting-wf
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
      - name: Install HTML Hint as development dependency
        run: npm install --save-dev htmlhint
      - name: Install style lint as development dependency
        run: npm install --save-dev stylelint
      - name: Lint Html files
        run: npx htmlhint "**/*.html"
      - name: Lint Css files
        run: npx stylelint "**/*.css"
